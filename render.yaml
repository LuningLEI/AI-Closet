envVarGroups:
  - name: ai-closet-production
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: closet-images
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SERVICE_NAME
        value: ai-closet
      - key: OBSERVABILITY_TOKEN
        sync: false

services:
  - type: web
    name: ai-closet-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/ready
    envVars:
      - fromGroup: ai-closet-production

  - type: worker
    name: ai-closet-recognition-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: python -m workers.recognition
    envVars:
      - fromGroup: ai-closet-production
      - key: SERVICE_NAME
        value: recognition-worker

  - type: worker
    name: ai-closet-outfit-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: python -m workers.outfits
    envVars:
      - fromGroup: ai-closet-production
      - key: SERVICE_NAME
        value: outfit-worker

  - type: worker
    name: ai-closet-taste-profile-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: python -m workers.taste_profiles
    envVars:
      - fromGroup: ai-closet-production
      - key: SERVICE_NAME
        value: taste-profile-worker

  - type: worker
    name: ai-closet-feedback-summary-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: python -m workers.free_text_taste
    envVars:
      - fromGroup: ai-closet-production
      - key: SERVICE_NAME
        value: feedback-summary-worker

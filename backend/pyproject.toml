[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-closet-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn>=0.49,<0.50",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.22,<0.1",
  "supabase>=2.31,<3",
  "httpx[http2]>=0.28,<0.29",
  "Pillow>=12,<13",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.3,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "workers", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["data", "evaluation"]

[tool.ruff.lint]
# Start with correctness errors; formatting/style adoption is tracked separately
# so CI never reports hundreds of pre-existing cosmetic violations as regressions.
select = ["F"]

[tool.mypy]
python_version = "3.13"
packages = ["app", "workers"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

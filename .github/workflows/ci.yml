name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-quality:
    name: Backend lint, types, tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - name: Lint production code
        run: ruff check app workers
      - name: Type-check production code
        run: mypy --follow-imports=skip app/ai/gateway.py app/core/runtime_snapshot.py app/services/recommendation/application.py app/api/routes/recommendations.py
      - name: Unit and contract tests
        run: python -m pytest tests
      - name: Import and compile API/workers/tools
        run: |
          python -m compileall app workers tools
          python -c "import app.main, workers.recognition, workers.outfits, workers.taste_profiles"

  api-contract:
    name: OpenAPI contract is current
    runs-on: ubuntu-24.04
    needs: backend-quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.lock
      - run: make export-openapi PYTHON=python
      - run: git diff --exit-code docs/api/openapi.json

  documentation:
    name: Documentation links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_markdown_links.py .

  migrations:
    name: Migration structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python backend/scripts/check_migrations.py

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Build iOS target without signing
        run: xcodebuild -project "ios/AI Closet.xcodeproj" -scheme "AI Closet" -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
